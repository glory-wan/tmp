seed: 17
workspace: outputs/detection_gligen_sdedit/test

closed_loop:
  rounds: 3
  warmup_epochs: 70
  finetune_epochs: 10
  synthetic_images_per_round: 500

# 关闭 subset 跑完整类别
class_subset:
  enabled: true
  count: 3
  class_ids: [14, 25, 53]  # e.g. [0, 2, 16]; takes precedence over count when set

label_scope:
  # full: train/eval real labels use all 80 COCO classes, while mining,
  # prompt optimization and bbox editing still use class_subset.
  # subset: previous quick-test behavior; train/eval labels also use class_subset.
  train_eval: full

data:
  train_annotations: data/coco/annotations/instances_minitrain2017.json
  train_images: data/coco/images/train2017
  val_annotations: data/coco/annotations/instances_val2017.json
  val_images: data/coco/images/val2017

yolov7:
  repo: external/yolov7
  weights: weights/yolov7.pt
  device: "4"
  image_size: 640

stable_diffusion:
  model: /data/model/models_zwq/stable-diffusion-inpainting
  local_files_only: true

mining:
  max_images: 1000
  min_failures_per_class: null
  conf: 0.001
  match_iou: 0.50
  low_confidence: 0.25
  ambiguous_gap: 0.08
  forgotten_threshold: 1

prompt_optimization:
  prompt_scope: class  # class or class_failure
  include_class_name: true #总prompt里会加入类别提示
  num_new_tokens: 4
  initializer_token: object
  # initializer_token, mean_emb_cov_emb, or class_name
  init_mode: mean_emb_cov_emb
  resume_from_previous: true
  resume_mode: overwrite  # overwrite or reinit
  resolution: 512
  max_train_steps: 1000
  save_steps: 100
  log_every: 10
  learning_rate: 0.0005
  strength: 0.65
  num_inference_steps: 5
  semantic_weight: 1.0
  class_semantic_weight: 0.0
  class_semantic_model: /data/model/models_zwq/clip-vit-large-patch14
  class_semantic_local_files_only: true
  detector_weight: 0.1
  instance_quality_filter:
    enabled: false
    config: detection_gligen_sdedit/configs/instance_quality_coco_mini.yaml
    # Optional direct override. If null, config.instance_quality.output_dir/instances_quality.json is used.
    results: null

generation:
  model: /data/model/models_zwq/gligen/diffusers-generation-text-box
  variant: null
  local_files_only: true
  device: cuda:4
  include_class_name: null  # null: inherit optimized prompt metadata; true/false: override
  max_images: 500
  max_objects_per_image: 20
  width: 512
  height: 512
  strength: 0.65
  noise_timestep: null
  guidance_scale: 7.5
  num_inference_steps: 30
  gligen_scheduled_sampling_beta: 0.3
  global_prompt_source: template
  global_prompt_template: "{phrases}, photo, highly detailed, photorealistic"
  enable_generation_filter: false
  min_bbox_area_ratio: 0.001
  save_visualization: false

finetune:
  workers: 8
  batch_size: 16
  epochs: 10
  save_every_epochs: null

evaluation:
  batch_size: 16
